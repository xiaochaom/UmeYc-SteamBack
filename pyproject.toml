
[tool.poetry]
name = "steamback"
version = "1.2.0"
description = "中文 Steam 存档备份与恢复工具"
authors = [
  "Kevin Hester <kevinh@geeksville.com>"
  ]
license = "GPL-3.0-or-later"
repository = "https://github.com/xiaochaom/UmeYc-SteamBack"
readme = "README.md"
packages = [
    { include = "steamback", from = "defaults/py_modules" },
]

[tool.poetry.scripts]
steamback = "steamback.__main__:main"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/xiaochaom/UmeYc-SteamBack/issues"

[tool.poetry.dependencies]
python = "^3.11"
platformdirs = "^4.0.0"
pillow = "^10.1.0"
psutil = "^5.9.1"
async-tkinter-loop = ">=0.10.4,<0.11"
sv-ttk = "^2.4"

[tool.poetry.group.dev.dependencies]
flake8 = ">=6.1,<8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools.package-data]
"*" = ["*.png"]
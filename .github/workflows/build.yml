name: 检查与构建
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:frontend
      - run: python3.11 bin/package-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: UmeYc-SteamBack
          path: artifacts/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UmeYc-SteamBack
          path: artifacts
      - name: 校验标签与版本并生成校验和
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('package.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, '标签与 package.json 版本不一致'
          PY
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS.txt \
            --verify-tag --title "UmeYc-SteamBack $RELEASE_TAG" \
            --notes-file doc/release-notes.md
